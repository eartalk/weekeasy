name: weekeasy

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: weekeasy
      POSTGRES_USER: weekeasy
      POSTGRES_PASSWORD: weekeasy
    ports:
      - '5432:5432'
    volumes:
      - weekeasy-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U weekeasy -d weekeasy']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    command: redis-server --appendonly yes
    ports:
      - '6379:6379'
    volumes:
      - weekeasy-redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  weekeasy-postgres:
  weekeasy-redis:
